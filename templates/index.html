<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wine Quality Predictor</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            width: 450px;
            color: white;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 6px 0;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        button {
            margin-top: 15px;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 10px;
            background: #ff7eb3;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #ff4f8b;
            transform: scale(1.05);
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #00ffcc;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>🍷 Wine Quality Predictor</h1>
    <p>Enter wine chemical properties to predict quality</p>

    <form action="/predict" method="post">

        <div class="grid">
            <input type="text" name="f1" placeholder="Fixed Acidity">
            <input type="text" name="f2" placeholder="Volatile Acidity">
            <input type="text" name="f3" placeholder="Citric Acid">
            <input type="text" name="f4" placeholder="Residual Sugar">
            <input type="text" name="f5" placeholder="Chlorides">
            <input type="text" name="f6" placeholder="Free Sulfur Dioxide">
            <input type="text" name="f7" placeholder="Total Sulfur Dioxide">
            <input type="text" name="f8" placeholder="Density">
            <input type="text" name="f9" placeholder="pH">
            <input type="text" name="f10" placeholder="Sulphates">
            <input type="text" name="f11" placeholder="Alcohol">
        </div>

        <button type="submit">🚀 Predict Quality</button>
    </form>

    <div class="result">
        {{ prediction_text }}
    </div>
</div>

</body>
</html>
